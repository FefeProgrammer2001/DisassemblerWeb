name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fefeprogrammer2001/asmviz
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp deploy/docker-compose.prod.yml root@$HOST:Documents/Site/docker-compose.yml
          ssh root@$HOST "bash -s" <<REMOTE
          set -euo pipefail
          cd ~/Documents/Site
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          PREV=\$(cat .current_tag 2>/dev/null || echo latest)
          echo "\$PREV" > .previous_tag
          echo "${{ github.sha }}" > .current_tag
          IMAGE_TAG=${{ github.sha }} docker compose pull
          IMAGE_TAG=${{ github.sha }} docker compose up -d
          docker logout ghcr.io
          docker image prune -f
          REMOTE

      - name: Health check, roll back on failure
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://www.mydisassembler.net/api/tools >/dev/null && { echo healthy; exit 0; }
            sleep 5
          done
          echo "unhealthy, rolling back"
          ssh root@$HOST 'cd ~/Documents/Site && IMAGE_TAG=$(cat .previous_tag) docker compose up -d'
          exit 1
